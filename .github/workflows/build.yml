name: Build Bukkit Plugin
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: mvn -B clean package
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: my-plugin
          path: target/*.jar
